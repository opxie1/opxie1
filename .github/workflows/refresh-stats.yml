name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # This job commits, so a bare `push` trigger would re-run it on its own
  # commit forever. The paths filter breaks that loop: the bot only ever
  # touches the four generated SVGs at the repo root, never scripts/.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - ".github/workflows/refresh-stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No personal access token needed: the built-in GITHUB_TOKEN returns the
      # same numbers, and the generator uses only the standard library.
      - name: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: commit on change
        run: |
          FILES="stats-*.svg streak-*.svg langs-*.svg year-*.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
